# AORUI Enterprise Pro Theme (Clean, Crisp, High-Contrast & Zero Halo)
glass_bg = "#0d1527f0"
accent = "#00d4ff"
accent_secondary = "#8b5cf6"
danger = "#ff4d6d"
success = "#10b981"
warning = "#fbbf24"
text_color = "#f8fafc"
text_muted = "#94a3b8"
corner_radius = 6.0
border_width = 1.0
glow_intensity = 0.12
