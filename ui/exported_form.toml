root = "artboard_root"

[window]
title = "AORUI Cyber App"
width = 960.0
height = 620.0

[[nodes]]
id = "artboard_root"
type = "Panel"
children = [
    "menubar_top",
    "card_stats_gpu",
    "btn_action_primary",
    "btn_action_secondary",
    "txt_search",
    "slider_volume",
    "toggle_status",
    "modal_dialog",
]
enabled = true
radius = 12.0
bg = "#3f5065fa"
border = "#7699bfcc"

[nodes.layout]
position = "relative"
width_percent = 100.0
height_percent = 100.0

[[nodes]]
id = "menubar_top"
type = "MenuBar"
children = []
enabled = true
radius = 6.0
items = [
    "Fichier",
    "Édition",
    "Affichage",
    "Outils",
    "Aide",
]
active_index = 0
bg = "#556981e6"
border = "#81add7b3"

[nodes.layout]
position = "absolute"
width = 912.0
height = 36.0
top = 20.0
left = 24.0

[[nodes]]
id = "card_stats_gpu"
type = "MetricCard"
children = []
text = "14.2 GFlops"
enabled = true
radius = 8.0
title = "GPU Compute Engine"
delta = "+8.4%"
delta_positive = true
bg = "#506581d9"
border = "#89b3e1cc"

[nodes.layout]
position = "absolute"
width = 260.0
height = 96.0
top = 72.0
left = 24.0

[[nodes]]
id = "btn_action_primary"
type = "Button"
