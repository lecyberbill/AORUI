[workspace]
resolver = "2"
members = [
    "crates/ui-core",
    "crates/ui-gpu",
    "crates/ui-layout",
    "crates/ui-widgets",
    "crates/agent-runtime",
    "examples",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.79"

[workspace.dependencies]
ui-core = { path = "crates/ui-core" }
ui-gpu = { path = "crates/ui-gpu" }
ui-layout = { path = "crates/ui-layout" }
ui-widgets = { path = "crates/ui-widgets" }
agent-runtime = { path = "crates/agent-runtime" }

serde = { version = "1", features = ["derive"] }
bytemuck = { version = "1", features = ["derive"] }
taffy = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
crossbeam-channel = "0.5"
wgpu = "0.19"
winit = "0.30"
glyphon = "0.5"
serde_json = "1"
thiserror = "1"
pollster = "0.3"
